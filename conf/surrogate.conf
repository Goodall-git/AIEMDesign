max_epochs: 90

log_interval: 10

only_evaluate: false # if true, it will only evalute the model on the validation set and exit

set_reproducible: false # if true, the training will be set to reproducible (refer to https://pytorch.org/docs/stable/notes/randomness.html)
                        # else torch.backends.cudnn.benchmark will be set to True for largest throughput


data {
    type_: EMParquetDataloader

    # x: 三个 19x15 二值矩阵 TM2 / TM3 / V1，展平 855 维
    x_key: topology
    # y: S11 / S21 / S22 的幅度(dB)，统一频率轴 101 点，展平 303 维
    y_key: s_mag_db

    x_enable_scale_to_minus1_1: true

    # 统一频率轴：0.0 ~ 10.0 GHz，101 点（步长 0.1 GHz）
    # 必须与 data/build_dataset.py 中的 FREQ_* 常量以及 conf/rl.conf 的 reward 保持一致
    y_enable_frequency_crop: false
    y_original_start_freq: 0.0
    y_original_end_freq: 10.0
    y_original_num_points: 101
    y_crop_start_freq: 0.0
    y_crop_end_freq: 10.0
    # 注意：开启统计归一化会让 y 不再是 dB，reward 的物理含义会被破坏
    y_enable_stat_normalize: false
    y_normalize_mean: 0.0
    y_normalize_max: 1.0
    y_normalize_min: 0.0

    # 保持 1：reward 的频率轴假设与数据一致，下采样会让 band 索引错位
    s_curve_downsample_factor: 1

    root: ./data
    batch_size: 32
    num_workers: 4
    config: null
    train_filename: train.parquet
    val_filename: val.parquet
    pin_memory: true
    persistent_workers: false
    drop_last: true
}

model {
    type_: EMResnet
    layers: [2,2,2]
    in_channels: 3      # TM2 / TM3 / V1 三个通道
    out_dim: 303        # 3 条 S 曲线 x 101 个频点
}

optimizer {
    type_: AdamW
    lr: 0.001
    betas: [0.9, 0.95]
    eps: 1e-8
    weight_decay: 1e-5
}

scheduler {
    type_: CosineAnnealingLR
    T_max: ${max_epochs}
    eta_min: 0.00001
}

loss {
    type_: L1Loss
}
