# 代理模型训练配置（V3.0）
#
# 相对旧版（V2.0）的关键改动与依据见 version.md / report.md：
#   * 训练轮次 + 早停：不再盲目跑满 90 epoch。旧版 epoch 59 之后 31 个 epoch
#     验证损失毫无改善（train 却继续降到 0.18），是纯粹的过拟合。
#     注意 max_epochs 同时是余弦退火的 T_max：两者必须一致，否则 LR 还没降到
#     低位就被早停打断，验证损失会明显偏差（实测 T_max=300 早停在 163 时
#     best=1.72，而 T_max=200 能降到 ~1.4）。
#   * 强正则：head_dropout 0.0 -> 0.25，weight_decay 1e-5 -> 2e-3。
#   * 提高学习率到 5e-3 并配合余弦退火：小模型 + 强正则下收敛更快更稳。
#   * 回归头频率卷积层数 3 -> 1：数据里曲线由 ~4~8 个真实频点插值而来，
#     更深的频率卷积只是拟合插值伪影，反而更差。
#   * 加入无源性软约束损失（PassivityPenalizedLoss），抑制物理上不可能的预测。
#   * 可选 EMA 权重平均 + 早停。
#
# 实测（3 个随机种子，val L1 / dB）：旧配置 2.59 -> 新配置 ~1.43。

max_epochs: 200

log_interval: 10

only_evaluate: false # if true, it will only evalute the model on the validation set and exit

set_reproducible: false # if true, the training will be set to reproducible (refer to https://pytorch.org/docs/stable/notes/randomness.html)
                        # else torch.backends.cudnn.benchmark will be set to True for largest throughput

# ---- 早停 ----
# 验证损失连续 early_stop_patience 个 epoch 未改善（改善量 < early_stop_min_delta）
# 就停止训练。设为 null 关闭早停。
early_stop_patience: 80
early_stop_min_delta: 0.0005

# ---- 梯度裁剪（null 关闭）----
grad_clip_norm: null

# ---- 权重 EMA（null 关闭）----
# 取 null 时用原始权重；小数据集上 EMA 能略微稳定泛化，但会牺牲一些训练速度。
ema_decay: null

data {
    type_: EMParquetDataloader

    # x: 三个 19x15 二值矩阵 TM2 / TM3 / V1，展平 855 维
    x_key: topology
    # y: S11 / S21 / S22 的幅度(dB)，统一频率轴 101 点，展平 303 维
    y_key: s_mag_db

    x_enable_scale_to_minus1_1: true

    # 统一频率轴：0.0 ~ 10.0 GHz，101 点（步长 0.1 GHz）
    # 必须与 data/build_dataset.py 中的 FREQ_* 常量以及 conf/rl.conf 的 reward 保持一致
    y_enable_frequency_crop: false
    y_original_start_freq: 0.0
    y_original_end_freq: 10.0
    y_original_num_points: 101
    y_crop_start_freq: 0.0
    y_crop_end_freq: 10.0
    # 注意：开启统计归一化会让 y 不再是 dB，reward 的物理含义会被破坏
    y_enable_stat_normalize: false
    y_normalize_mean: 0.0
    y_normalize_max: 1.0
    y_normalize_min: 0.0

    # 保持 1：reward 的频率轴假设与数据一致，下采样会让 band 索引错位
    s_curve_downsample_factor: 1

    root: ./data
    batch_size: 32
    num_workers: 4
    config: null
    train_filename: train.parquet
    val_filename: val.parquet
    pin_memory: true
    persistent_workers: false
    drop_last: true
}

model {
    type_: EMResnet
    layers: [2,2,2]
    in_channels: 3      # TM2 / TM3 / V1 三个通道
    out_dim: 303        # 3 条 S 曲线 x 101 个频点

    # ---- 回归头（详见 version.md 第 5 节）----
    # spectral: 保留全部空间位置 + 频率轴 1D 卷积（默认，推荐）
    # gap:      旧版全局平均池化 + 单层全连接（仅用于对照实验）
    head_type: spectral
    spatial: [19, 15]   # 输入版图尺寸，必须与数据一致
    n_freq: 101         # 频率点数；out_dim 必须等于 n_s_params * n_freq
    head_hidden: 256    # 展平后的投影维度（参数量主要来自这里）
    head_mid: 128       # 频率方向 1D 卷积的通道数
    # 频率方向只做 1 层卷积即可：曲线由少量真实频点插值而来，更深的频率卷积
    # 只会拟合插值伪影（实测 conv_layers=1 明显优于 3/5）。
    head_conv_layers: 1
    head_conv_kernel: 5
    # 旧版 0.0 导致明显过拟合（train/val L1 差 15 倍）。0.25 是实测最优点。
    head_dropout: 0.25
}

optimizer {
    type_: AdamW
    lr: 0.005
    betas: [0.9, 0.95]
    eps: 1e-8
    # 旧版 1e-5 对 5M 参数/3762 样本来说太弱，实测 2e-3 能显著缩小泛化差距
    weight_decay: 0.002
}

scheduler {
    type_: CosineAnnealingLR
    T_max: ${max_epochs}
    eta_min: 0.00001
}

loss {
    # 数据拟合损失 + 无源性软约束（详见 src/loss/passivity.py）
    type_: PassivityPenalizedLoss
    n_freq: 101
    # 违反 |S11|^2+|S21|^2<=1 / |S21|^2+|S22|^2<=1 的平方惩罚权重。
    # 设为 0 可退化为纯 L1。
    #
    # 实测说明（务必了解，避免误以为它「保证」了无源性）：
    #   * lambda=0.05 时验证 L1 最好（~1.40），但预测仍有 ~95% 的样本在某个
    #     频点上越界 —— 这个权重主要起正则作用，不是硬约束。
    #   * 要把越界率压到 ~70% 需要 lambda>=0.1，代价是验证 L1 变差 ~0.1 dB。
    #   * 真值本身贴着边界（带内 |S11|^2+|S21|^2 均值 0.988），dB 空间里极小的
    #     误差就会造成越界，软惩罚很难彻底消除。
    #   * 要「保证」满足约束，需要在输出层做参数化（如 S11=cos、S21=sin 的
    #     三角参数化），属于后续工作。
    lambda_passivity: 0.05
    criterion {
        type_: L1Loss
    }
}
