max_episodes: 10000
log_interval: 10
save_interval: 100
set_reproducible: false

pretrain {
    epochs: 200
    top_ratio: 0.05
    min_hamming: 25
    data_root: ./data
    train_filename: train.parquet
    batch_size: 64
    lr: 0.005
    log_interval: 25
}

policy_model {
    type_: AntennaRowPolicyModel
    n_matrices: 3
    n_rows: 19
    row_bits: 15
    hidden_size: 64
    temperature: null
    tanh_constant: null
    v1_matrix_index: 2
    v1_max_total: 20
    v1_max_per_row: 6
    total_max_white: 420
}

surrogate_model {
    type_: EMResnet
    layers: [2,2,2]
    in_channels: 3
    out_dim: 303
    head_type: spectral
    spatial: [19, 15]
    n_freq: 101
    head_hidden: 256
    head_mid: 128
    head_conv_layers: 1
    head_conv_kernel: 3
    head_dropout: 0.25
    freq_mod_rank: 24
    load_from: surrogate_output/11_resonance_wideband/best_checkpoint.pt
}

rl {
    batch_size: 32
    entropy_coef: 0.01
    adv_eps: 1e-8
    grad_clip_norm: null
}

infer {
    n_samples: 500
    batch_size: 100
    top_k: 10
}

# 匹配网络：8.4~9.3 GHz 带内 S11/S22 深极小值
reward {
    type_: MatchingNetworkReward
    passband: [7.5, 9.9]
    freq_start_ghz: 0.0
    freq_end_ghz: 10.0
    num_points: 101
    s_param_order: [S11, S21, S22]

    weight_s21_pass: 0.5
    weight_s11_min: 1.0
    weight_s22_min: 1.0
    min_target_db: -25.0
    weight_dip: 0.5
    dip_margin_db: 0.0
    min_edge_headroom_db: 2.0
    max_dip_bonus_db: 8.0
    weight_min_position: 0.5
    weight_s21_stop: 0.0
    stopband_aggregation: mean
    clamp_db: [-60.0, 0.0]
}

optimizer {
    type_: AdamW
    lr: 0.0003
    betas: [0.9, 0.95]
    eps: 1e-8
    weight_decay: 1e-5
}

scheduler {
    type_: CosineAnnealingLR
    T_max: ${max_episodes}
    eta_min: 0.00003
}
