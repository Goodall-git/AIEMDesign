max_epochs: 200
log_interval: 10
only_evaluate: false
set_reproducible: false
early_stop_patience: 80
early_stop_min_delta: 0.0005
grad_clip_norm: null
ema_decay: null

data {
    type_: EMParquetDataloader
    x_key: topology
    y_key: s_mag_db
    x_enable_scale_to_minus1_1: true
    y_enable_frequency_crop: false
    y_original_start_freq: 0.0
    y_original_end_freq: 10.0
    y_original_num_points: 101
    y_crop_start_freq: 0.0
    y_crop_end_freq: 10.0
    y_enable_stat_normalize: false
    y_normalize_mean: 0.0
    y_normalize_max: 1.0
    y_normalize_min: 0.0
    s_curve_downsample_factor: 1
    root: ./data
    batch_size: 32
    num_workers: 4
    config: null
    train_filename: train.parquet
    val_filename: val.parquet
    pin_memory: true
    persistent_workers: false
    drop_last: true
}

model {
    type_: EMResnet
    layers: [2,2,2]
    in_channels: 3
    out_dim: 303
    head_type: spectral
    spatial: [19, 15]
    n_freq: 101
    head_hidden: 256
    head_mid: 128
    head_conv_layers: 1
    head_conv_kernel: 5
    head_dropout: 0.25
    freq_mod_rank: 8
}

optimizer {
    type_: AdamW
    lr: 0.005
    betas: [0.9, 0.95]
    eps: 1e-8
    weight_decay: 0.002
}

scheduler {
    type_: CosineAnnealingLR
    T_max: ${max_epochs}
    eta_min: 0.00001
}

loss {
    type_: ResonanceWeightedLoss
    n_freq: 101
    band: [8.4, 9.3]
    depth_threshold_db: 3.0
    edge_margin_points: 3
    weight: 5.0
    criterion { type_: L1Loss }
}
