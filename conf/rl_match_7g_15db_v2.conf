max_episodes: 10000

# ===========================================================================
# rl_match_7g_15db.conf -- 带内目标 -15 dB 版本（2026-10-20 新增）
# ===========================================================================
# 需求变更：带内 S11/S22 只需要做到 -15 dB，不再要求 -25 dB。
#
# 与 rl_match_7g.conf 的差异只有 4 处：
#   1. reward.min_target_db : -25.0 -> -15.0
#        达到 -15 dB 即封顶不再加分，策略不必继续把带内压深。
#   2. reward.weight_out_of_band_penalty : 4.0 -> 6.0
#   3. reward.out_of_band_margin_db      : 0.0 -> 2.0
#        带外必须比带内浅 2 dB 以上，否则扣分。目标变浅以后带外那个
#        8.9 GHz 谐振更容易顺手做深，必须把这一项加强。
#   4. pretrain.epochs : 200 -> 0
#        本轮从 19_match_7g_warm 的策略权重热启动（tools/warm_start.py），
#        不再用 9 个模板做行为克隆 —— 那 9 个是 -25 dB 目标下挑出来的，
#        对 -15 dB 任务反而会把策略锁死在窄分布上。
#
# 数据集核对（data/train.parquet 3762 条真实标签）：
#   带内 6.5~7.5 GHz 两个通道都 <= -15 dB 的样例 : 1212 条 (32%)
#   其中「带外不比带内更深」的                  :   19 条
#   -> -15 dB 任务的可用真实信号比 -25 dB 多两个数量级，
#      RL 不再完全依赖代理模型在稀疏区外推。
# ===========================================================================
# 输出目录由命令行 --output_dir 指定，建议 rl_output/15_match_7g
log_interval: 10
save_interval: 100
set_reproducible: false

pretrain {
    # ---- 7 GHz 任务专用的预训练选样 ----
    # 7 GHz 在数据集里覆盖极稀疏：3762 个样本中，真正在 6.5~7.5 GHz 形成
    # 带内深凹陷、reward>18 的只有 18 个；其余样本的谷都跑到带外，
    # 被 min_edge_headroom 门控清零（reward≈0）。
    #
    # 因此在 top_ratio 之外再加一道 min_reward 绝对阈值：
    #   top_ratio=0.05 -> 取 188 个，其中仅 18 个 reward>18（10%）
    #   + min_reward=18 -> 保留 18 个（实测 reward 均值 1.54 -> 33.72）
    # 不做这一步的话，行为克隆有 90% 的时间在教策略生成错误目标。
    epochs: 0
    top_ratio: 0.05
    min_reward: 18.0
    # 18 个里有完全重复的版图（两两汉明 min=0）。min_hamming=10 去重后剩 9 个，
    # 仍覆盖 6.7~7.3 GHz 不同谷位置，保留多样性。
    min_hamming: 10
    data_root: ./data
    train_filename: train.parquet
    batch_size: 64
    lr: 0.005
    log_interval: 25
}

policy_model {
    type_: AntennaRowPolicyModel
    n_matrices: 3
    n_rows: 19
    row_bits: 15
    hidden_size: 64
    temperature: null
    tanh_constant: null
    v1_matrix_index: 2
    v1_max_total: 20
    v1_max_per_row: 6

    # ---- 7 GHz 任务的联合密度上限 ----
    # 原 420 是宽松值。7 GHz 属于「数据稀疏区」，必须收紧，否则策略会靠
    # 堆金属把谐振拉低（物理规律：白点数与谷频率相关系数 -0.436，
    # 白点<=320 时谷中位 9.10 GHz，>=392 时 8.20 GHz），从而钻进代理模型
    # 的外推区并 hack 出虚假深凹陷。
    #   * 训练集全体:  mean 278, p95 357, p99 397, max 474
    #   * 真实 7 GHz 深凹陷设计(谷 6-7GHz, n=8): mean 360, max 367
    # 取 397 = 训练集 p99。
    # 实测：收紧到 397 后，代理模型在 7 GHz 仍能找到 reward 50.8 的解
    # （S11 -26.7 dB @ 7.2 GHz），说明约束不会把解卡死；
    # 而放宽到 474 找到的「最优解」V1=76（上限 20），是典型的外推产物。
    total_max_white: 397
}

surrogate_model {
    type_: EMResnet
    layers: [2,2,2]
    in_channels: 3
    out_dim: 303
    head_type: spectral
    spatial: [19, 15]
    n_freq: 101
    head_hidden: 256
    head_mid: 128
    head_conv_layers: 1
    head_conv_kernel: 3
    head_dropout: 0.25
    freq_mod_rank: 24
    # V4 代理模型：多频段谐振损失训练（低频凹陷召回 11% -> 100%）
    # 旧的 11_resonance_wideband 在 6.5~7.5 GHz 完全预测不出凹陷，
    # 用它做 7 GHz 任务等于在纯外推上做 RL（实测 S11 谷一直停在 8.6 GHz）。
    load_from: surrogate_output/12_resonance_lowfreq/best_checkpoint.pt
}

rl {
    batch_size: 32
    entropy_coef: 0.01
    adv_eps: 1e-8
    grad_clip_norm: null
}

infer {
    n_samples: 500
    batch_size: 100
    top_k: 10
}

# ---------------------------------------------------------------------------
# 预训练轮次为什么是 200（不是 400）
# ---------------------------------------------------------------------------
# 只有 9 个样本做行为克隆，光看交叉熵会被误导：CE 从 4.21 一路降到
# 0.30（400 epoch），看起来"收敛得很好"，但那是对 9 个样本的死记硬背。
# 真正该看的是采样分布还剩多少多样性（256 次采样的 sequence entropy）：
#
#   epochs    CE     entropy(256 samples)   采样唯一数   reward均值
#     0      4.21        431  (100%)           256/256     -11.34
#    60      4.06        188  ( 44%)           256/256      -8.18
#   120      3.24        173  ( 40%)           256/256      -8.16
#   200      1.30        134  ( 31%)           256/256      -5.58
#   300      0.52         72  ( 17%)           256/256      -4.15
#   400      0.30         40  (  9%)           256/256      -1.29
#
# GRPO 靠组内 reward 方差产生 advantage。entropy 掉到初始的 9% 时，
# 采样几乎全落在少数几个模板附近，组内方差趋近 0，advantage 变成 1e-8
# 量级，RL 就不学了（report.md 第 3.1 / 11.1 节记录过这个坑）。
# 200 epoch 时 entropy 还有初始的 31%，且 256 次采样全部唯一，
# 既把分布推向了好设计附近，又保留了探索空间，因此取 200。

# 匹配网络：7.0 GHz 带内 S11/S22 深极小值
#
# 为什么是 [6.5, 7.5] 而不是更窄的 [6.65, 7.35]：
#   带中心仍是 7.0 GHz，但真实训练集里 7 GHz 深凹陷设计的谷散布在
#   6.9~7.1 GHz。窄带会把带边卡在 6.65/7.35，谷稍偏就触发
#   min_edge_headroom_db 门控失败，reward 从 56.2 掉到 30.3
#   （实测 top5 全部谷在 7.0~7.1，属于带内内部凹陷，不是带边伪解）。
#
# ---------------------------------------------------------------------------
# 数据支撑（非常重要，决定这个任务能不能收敛）
# ---------------------------------------------------------------------------
# 训练集 3762 个样本，按「S11 谷落在哪个频段」统计：
#     6-7 GHz    8 个        7-8 GHz   15 个
#     8-9 GHz   79 个        9-10 GHz  50 个
#
# 更严格的指标 —— 目标带内是否真的存在「内部极小值」
# （谷既不贴左带边也不贴右带边，才配得上"带内谐振点"）：
#     频段 6.5~7.5 GHz（11 个频点）:   19 个样本 (0.5%)
#     频段 7.5~9.9 GHz（25 个频点）:  166 个样本 (4.4%)
#
# 也就是 7 GHz 的可用信号比 8.7 GHz 稀疏约 9 倍。这直接体现在 reward
# 分布上（真实训练集）：
#     8.7 GHz band: reward>20 的设计 142 个，其中最高 59.0
#     7.0 GHz band: reward>20 的设计  18 个，其中最高 56.2
#
# 窄带（11 个频点）本身也放大了难度：谷只要偏到带边，min(带内首尾)
# 就退化成"单调下降"，min_edge_headroom 门控直接把 reward 清零。
# 这不是 bug，而是"带内谐振点"这个要求本身在窄带上的严格体现。
#
# 实际训练验证（rl_output/15_match_7g，382 iter 试跑）：
#   iter 0-500   reward 均值 -0.22
#   iter 3000+   reward 均值  1.54    （8.7GHz 任务同期已达 55）
#   趋势在涨但极慢，原因是 99% 的采样都撞在门控外，组内只有极少数
#   样本能拿到非零 reward，advantage 信号太稀。
#
# 结论：这个配置是可以跑的起点，但要拿到接近 8.7 GHz 的效果，
# 根本办法是补充 6~8 GHz 的仿真数据重训代理模型（当前代理在这段
# 属于外推，实测把训练集里 8 个真实 6.7 GHz 凹陷样本喂进去，
# 8/8 全部预测到 9.1 GHz，完全复现不出低频谐振）。
reward {
    type_: MatchingNetworkReward
    passband: [6.5, 7.5]
    freq_start_ghz: 0.0
    freq_end_ghz: 10.0
    num_points: 101
    s_param_order: [S11, S21, S22]

    weight_s21_pass: 0.5
    weight_s11_min: 1.0
    weight_s22_min: 1.0
    min_target_db: -15.0
    weight_dip: 0.5
    dip_margin_db: 0.0
    min_edge_headroom_db: 2.0
    max_dip_bonus_db: 8.0
    weight_min_position: 0.5
    weight_s21_stop: 0.0
    stopband_aggregation: mean

    # ---- 带外谐振抑制（本轮新增，修复「9 GHz 有更深谐振点」）----
    # 现象：只约束带内时，RL 生成的 Top-5 版图 S11 在 8.9 GHz 有 -26~-29 dB
    # 的谐振，而带内 7.2 GHz 只有 -22~-24 dB。也就是真正的主谐振跑到带外，
    # 带内那个"谷"只是次级副瓣，实物上不成立。
    # 原因：min_target_db=-25 让带内做到 -25 dB 就封顶不再加分，策略于是
    # 把"多余的能力"用去带外造更深的谐振（对 reward 无损失）。
    #
    # 打开后：带内已做出合格凹陷(gate 通过)的前提下，
    #   excess = relu(带内最深 - 带外最深)   # dB 负值，带外更深则 >0
    # reward -= w * excess * gate
    # 实测对已生成的 Top-5 扣分：54.1->47.3, 54.1->50.7, 53.5->48.8 ...
    # 人工对照：带内-25/带外-30 => 扣 20 分；带内-25/带外-18 => 不扣。
    #
    # 注意必须乘 gate：无条件的 relu 会诱导"整条压平"的退化解
    # （实测 w=1 时 reward 从 57 掉到 -0.44，S11 带内只剩 -2.5 dB）。
    weight_out_of_band_penalty: 10.0
    # margin 必须为 0：实测 margin=2.0 时策略会「精准用满这 2 dB」，
    # 带外仍然比带内深 1~2 dB，S11 全局最低点还是落在 8.9 GHz。
    # 注意 sign：penalty = relu(in_min - out_min - margin)
    #   margin= 0  -> 只要求带外不比带内更深
    #   margin=-2  -> 要求带外比带内浅 2 dB 以上（本轮用这个）
    #   margin=+2  -> 反而允许带外深 2 dB（20 号 run 误用了这个值，
    #                 结果 S11 带外停在 -22.9 与带内 -21.1 打平）
    out_of_band_margin_db: -2.0
    clamp_db: [-60.0, 0.0]
}

optimizer {
    type_: AdamW
    lr: 0.0003
    betas: [0.9, 0.95]
    eps: 1e-8
    weight_decay: 1e-5
}

scheduler {
    type_: CosineAnnealingLR
    T_max: ${max_episodes}
    eta_min: 0.00003
}
