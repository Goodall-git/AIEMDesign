max_epochs: 220
log_interval: 10
only_evaluate: false
set_reproducible: false
early_stop_patience: 90
early_stop_min_delta: 0.0005
grad_clip_norm: null
ema_decay: null

data {
    type_: EMParquetDataloader
    x_key: topology
    y_key: s_mag_db
    x_enable_scale_to_minus1_1: true
    y_enable_frequency_crop: false
    y_original_start_freq: 0.0
    y_original_end_freq: 10.0
    y_original_num_points: 101
    y_crop_start_freq: 0.0
    y_crop_end_freq: 10.0
    y_enable_stat_normalize: false
    y_normalize_mean: 0.0
    y_normalize_max: 1.0
    y_normalize_min: 0.0
    s_curve_downsample_factor: 1
    root: ./data
    batch_size: 32
    num_workers: 4
    config: null
    train_filename: train.parquet
    val_filename: val.parquet
    pin_memory: true
    persistent_workers: false
    drop_last: true
}

model {
    type_: EMResnet
    layers: [2,2,2]
    in_channels: 3
    out_dim: 303
    head_type: spectral
    spatial: [19, 15]
    n_freq: 101
    head_hidden: 256
    head_mid: 128
    head_conv_layers: 1
    head_conv_kernel: 3
    head_dropout: 0.25
    freq_mod_rank: 24
}

optimizer {
    type_: AdamW
    lr: 0.005
    betas: [0.9, 0.95]
    eps: 1e-8
    weight_decay: 0.002
}

scheduler {
    type_: CosineAnnealingLR
    T_max: ${max_epochs}
    eta_min: 0.00001
}

# ---------------------------------------------------------------------------
# V4：多频段谐振加权（关键改动）
# ---------------------------------------------------------------------------
# V3 只用单个 band=[7.5, 9.9]，导致 7.5 GHz 以下**没有任何凹陷深度监督**。
# 后果实测（surrogate_output/11_resonance_wideband，val 418 条）：
#   * 整段 6.5~7.5 GHz 的平均 L1 只有 0.67 dB —— 看起来拟合得很好，
#     但那是因为低频曲线本来就平坦、容易拟合；
#   * 可一旦只看「真实存在低频凹陷」的那 9 个样本，带内 L1 高达 5.95 dB，
#     且预测凹陷深度 9 个里 8 个是 0.00 dB（真值 1.0~6.8 dB）。
#   把训练集里 8 个真实的 6.7 GHz 谐振样本喂回去，8/8 全部预测到 9.1 GHz。
#   结论：低频凹陷不是"学得不好"，而是**根本没被监督过**。
#
# 根因是样本占比：6.5~7.5 GHz 有凹陷的样本只占 0.24%（9/3762），
# 均匀 L1 下它们只能拿到 0.24% 的梯度，完全被平坦样本淹没。
#
# 改法：
#   1) bands 改成多频段，低频段单独加一份深度监督；
#      两个 band 的贡献等权平均，低频不再被高频淹没。
#   2) depth_threshold_db 3.0 -> 1.5：低频凹陷本身很浅（6.5~7.5 GHz
#      中位深度仅 1.86 dB，只有 3 个样本 >2dB），沿用 3.0 会让低频
#      永远落入"负样本"，被当成"要抑制的虚假凹陷"，方向反了。
#   3) position_weight 0.2 -> 0.5：低频谷位置必须准确（RL 目标是 7 GHz），
#      位置监督比对深度更关键。
#
# 实测结果（surrogate_output/12_resonance_lowfreq, best epoch=113, val L1 1.95）
# ---------------------------------------------------------------------------
# 训练集上按频段统计「真实有凹陷的样本 => 预测是否也出现凹陷」的召回率：
#
#   频段         样本数   V3 召回   V4 召回   V3 谷误差  V4 谷误差
#   6-7 GHz         4       0%      100%      0.35       0.05
#   6.5-7.5 GHz     9      11%      100%      0.46       0.14
#   7-8 GHz         3      33%      100%      0.17       0.13
#   8-9 GHz        54      94%       85%      0.15       0.08
#   8.5-9.9 GHz    72     100%       96%      0.17       0.08
#   9-10 GHz       39      97%       95%      0.23       0.10
#
# 低频全面打通，高频仅微降（8.5-9.9 的 96% vs 100% 只差 3 个样本，
# 且谷位置误差反而从 0.17 降到 0.08 GHz）。整体 val L1 1.946 -> 1.919。
#
# 最关键的变化体现在 RL 的实际搜索上（同一套奖励 + 同一个起点池）：
#   passband [6.5,7.5]  V3: reward 55.7 但 S11 谷在 8.6 GHz（假解，跑到带外）
#                       V4: reward 56.9 且 S11 谷在 7.0 GHz（S11 -26.9dB / S22 -30.9dB）
#   passband [6.4,7.1]  V3: reward  0.7（学不动）
#                       V4: reward 24.8（有信号了）

loss {
    type_: ResonanceWeightedLoss
    n_freq: 101
    bands: [[7.5, 9.9], [6.0, 8.0]]
    depth_threshold_db: 1.5
    edge_margin_points: 1
    weight: 12.0
    depth_weight: 2.0
    depth_negative_weight: 0.1
    depth_negative_margin_db: 0.5
    depth_clip_db: 12.0
    position_weight: 0.5
    position_temperature: 0.5
    criterion { type_: L1Loss }
}
