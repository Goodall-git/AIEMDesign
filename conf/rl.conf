max_episodes: 10000

log_interval: 10

save_interval: 100

set_reproducible: false # if true, the training will be set to reproducible (refer to https://pytorch.org/docs/stable/notes/randomness.html)
                        # else torch.backends.cudnn.benchmark will be set to True for largest throughput

# 逐行生成 3 个 19x15 二值矩阵：共 3*19 = 57 步，每步 15 bit，词表 2^15 = 32768
policy_model {
    type_: AntennaRowPolicyModel
    n_matrices: 3
    n_rows: 19
    row_bits: 15
    hidden_size: 64
    temperature: null
    # tanh 压缩会把 logits 限制在 ±tanh_constant，词表 32768 时 softmax 会接近均匀分布
    # 且梯度饱和，因此这里关闭；如需回到旧行为可设为 1.5
    tanh_constant: null
}

surrogate_model {
    type_: EMResnet
    layers: [2,2,2]
    in_channels: 3
    out_dim: 303
    load_from: surrogate_output/01/checkpoint.pt  # 上一步仿真模型训练的输出，需按实际路径修改
}

rl {
    batch_size: 32
    entropy_coef: 0.001
    adv_eps: 1e-8
    grad_clip_norm: null
}

infer {
    n_samples: 100
    batch_size: 100
    top_k: 10
}

# 频段内 S11 / S22 越小越好，S21 越大越好
#   reward = -w11*mean(S11_dB) - w22*mean(S22_dB) + w21*mean(S21_dB)
# 注意：S21 常常远低于 0 dB 而 S11/S22 接近 0 dB，若想让三者权重均衡，
# 可调小 weight_s21 或调大 weight_s11 / weight_s22
reward {
    type_: MultiSParamBandReward
    bands: [6.4, 7.1]
    # 频率轴，必须与 data 配置一致（0 ~ 10 GHz，101 点）
    freq_start_ghz: 0.0
    freq_end_ghz: 10.0
    num_points: 101
    s_param_order: [S11, S21, S22]
    weight_s11: 1.0
    weight_s22: 1.0
    weight_s21: 1.0
    # 预测值可能超出数据范围，截断到与数据集一致的 dB 区间
    clamp_db: [-60.0, 0.0]
}

optimizer {
    type_: AdamW
    lr: 0.0001
    betas: [0.9, 0.95]
    eps: 1e-8
    weight_decay: 1e-5
}

scheduler {
    type_: CosineAnnealingLR
    T_max: ${max_episodes}
    eta_min: 0.0001
}
