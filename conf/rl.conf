max_episodes: 10000

log_interval: 10

save_interval: 100

set_reproducible: false # if true, the training will be set to reproducible (refer to https://pytorch.org/docs/stable/notes/randomness.html)
                        # else torch.backends.cudnn.benchmark will be set to True for largest throughput

# 逐行生成 3 个 19x15 二值矩阵：共 3*19 = 57 步，每步 15 bit，词表 2^15 = 32768
policy_model {
    type_: AntennaRowPolicyModel
    n_matrices: 3
    n_rows: 19
    row_bits: 15
    hidden_size: 64
    temperature: null
    # tanh 压缩会把 logits 限制在 ±tanh_constant，词表 32768 时 softmax 会接近均匀分布
    # 且梯度饱和，因此这里关闭；如需回到旧行为可设为 1.5
    tanh_constant: null

    # ---- 稀疏通道（V1）密度约束 ----
    # 训练数据里 V1 通道极度稀疏（285 像素中白点数 mean=6.84、max=20，
    # 单行白点 max=6，71.5% 的行全空），TM2/TM3 密度则约 0.45 / 0.51。
    # 不加约束时策略会把 V1 刷白到分布外（实测 top-k 密度 0.70~0.81，
    # z-score≈+37），代理模型在该区域纯属外推，会报出虚假的优异 S 参数，
    # 即 reward hacking —— 这些版图在真实仿真中并不存在。
    # 设为 null 可关闭约束（回到旧行为）。
    v1_matrix_index: 2
    v1_max_total: 20      # V1 白点总数上限，训练集/验证集实测上界均为 20
    v1_max_per_row: 6     # 单行白点上限，训练集实测上界为 6

    # ---- 联合密度约束（覆盖全部三个通道）----
    # 只约束 V1 时策略会把压力转移到 TM2/TM3（report.md 第 7 节实测：
    # top-k 被刷到 0.97/1.00，远超训练集上限 0.825/0.937）。
    # total_max_white 约束三个矩阵合计白点数，从机制上封住这种转移。
    # 训练集实测 p99=397、max=474（整体填充率 max 0.554）。
    # null = 关闭（默认，保持与旧实验可比）。
    # 匹配网络同样需要防止策略把 TM2/TM3 刷满；实测只换代理模型不足以
    # 阻止外推（rl_output/04_A 的 Top-1 仍达到 0.92/0.97）。
    total_max_white: 474
}

surrogate_model {
    type_: EMResnet
    layers: [2,2,2]
    in_channels: 3
    out_dim: 303
    # 回归头配置必须与 conf/surrogate.conf 的 model 段完全一致，
    # 否则 load_state_dict 会因参数名/形状不匹配而报错
    head_type: spectral
    spatial: [19, 15]
    n_freq: 101
    head_hidden: 256
    head_mid: 128
    head_conv_layers: 1
    head_conv_kernel: 5
    head_dropout: 0.25
    # 注意：该 checkpoint 的架构必须与上面的 head_type 一致。
    # surrogate_output/01 是旧版 gap 头（195K 参数，state_dict 只有 fc.*），
    # 与这里的 head_type: spectral 不兼容，加载会直接报 Missing/Unexpected keys。
    # 03 是 V3.0 重新训练的 spectral 头（5.03M 参数，conv_layers=1）。
    # 注意务必加载 best_checkpoint.pt（而不是 checkpoint.pt）：
    # checkpoint.pt 是最后一轮权重，best 才是验证最优的那一轮。
    load_from: surrogate_output/03/best_checkpoint.pt
}

# 策略监督预训练：用训练集里 reward 最高的 top_ratio 版图做行为克隆，
# 把初始分布推到「好设计附近」再开始 GRPO。
# epochs=0 关闭（回到纯 RL 的旧行为）。
pretrain {
    # 实测：30 epoch 只能把 CE 从 10.40 降到 ~10.0（几乎没学到），
    # 100 epoch + lr=5e-3 可降到 1.55，200 epoch + hidden=128 可到 ~1.0。
    epochs: 200
    top_ratio: 0.05
    data_root: ./data
    train_filename: train.parquet
    batch_size: 64
    lr: 0.003
    log_interval: 25
}

rl {
    batch_size: 32
    entropy_coef: 0.001
    adv_eps: 1e-8
    grad_clip_norm: null
}

infer {
    n_samples: 100
    batch_size: 100
    top_k: 10
}

# 带通滤波器形状：全频带优化（带内 + 带外一起约束）
#   带内：S21 越大越好（插损小）、S11 / S22 越小越好（匹配好）
#   带外：S21 越小越好（抑制 / 滚降，这是形成滤波形状的关键）
#
#   reward = + w_s21_pass * mean(S21_dB[带内])
#            - w_s11_pass * mean(S11_dB[带内])
#            - w_s22_pass * mean(S22_dB[带内])
#            - w_s21_stop * agg(S21_dB[带外])
#
# 各项都在 dB 尺度上，权重即兑换比：w_s21_pass=2 且 w_s21_stop=1 表示
# “带内 1 dB 插损 == 带外 2 dB 抑制”。
# 注意别让带外的权重相对带内 S21 过大，否则策略会去找“整条曲线一起压到
# -60 dB”的退化解（例如整块金属屏蔽）来白拿三项分。
reward {
    # 现在是匹配网络任务（带内 S11/S22 深极小值），不再是带通滤波器。
    # MatchingNetworkReward 直接优化「带内最小值」并奖励「极小值落在带内」，
    # 详见 src/reward/band_rew.py。
    type_: MatchingNetworkReward
    passband: [6.4, 7.1]

    # 频率轴，必须与 data 配置一致（0 ~ 10 GHz，101 点）
    freq_start_ghz: 0.0
    freq_end_ghz: 10.0
    num_points: 101
    s_param_order: [S11, S21, S22]

    # ---- 带内 ----
    weight_s21_pass: 1.0   # 插损：越大越好
    weight_s11_min: 1.0    # 带内 S11 最小值：越小越好（匹配深度）
    weight_s22_min: 1.0    # 带内 S22 最小值：越小越好
    # 匹配深度上限：达到 -25 dB 后不再加分，避免刷「整段压到 -60 dB」。
    min_target_db: -25.0
    # 带内真凹陷奖励：两端都高于内部最深处才给分（编码「极小值在带内」）。
    weight_dip: 0.5
    dip_margin_db: 0.0
    # 门控：两端必须比内部最深处浅 >= 这个值，匹配项才计分。
    # 用于排除「从带边单调下降 / 均匀匹配」的伪极小值。
    min_edge_headroom_db: 3.0
    # 最深处越靠近带中心，额外加分（0=关闭）。匹配网络希望谐振点在带内
    # 而不是贴着带边，建议 0.5~1.0。
    weight_min_position: 0.5

    # ---- 带外 ----
    # 匹配网络通常不要求带外抑制，默认关闭；需要时设 >0。
    weight_s21_stop: 0.0
    stopband_aggregation: mean   # mean=带外平均抑制 | max=带外最差点(更严格)

    # 预测值可能超出数据范围，截断到与数据集一致的 dB 区间
    clamp_db: [-60.0, 0.0]
}

optimizer {
    type_: AdamW
    lr: 0.0001
    betas: [0.9, 0.95]
    eps: 1e-8
    weight_decay: 1e-5
}

scheduler {
    type_: CosineAnnealingLR
    T_max: ${max_episodes}
    eta_min: 0.0001
}
